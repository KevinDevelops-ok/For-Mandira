<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Explore My Heart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,500&family=Dancing+Script:wght@500;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --pink: #f6d8e0;
    --pink-soft: #fbeaef;
    --rose-gold: #d9a4a0;
    --rose-gold-deep: #c07f7e;
    --cream: #fbf4e9;
    --cream-deep: #f3e6d3;
    --gold: #d9b46a;
    --gold-light: #eecf94;
    --plum: #4a2c3b;
    --plum-soft: #7a5262;
    --shadow: rgba(122, 72, 78, 0.25);
    --font-display: 'Playfair Display', serif;
    --font-hand: 'Dancing Script', cursive;
    --font-ui: 'Poppins', sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    height:100%;
    overflow:hidden;
    background:linear-gradient(160deg,var(--cream) 0%, var(--pink-soft) 55%, var(--pink) 100%);
    font-family:var(--font-ui);
    color:var(--plum);
    touch-action:none;
  }
  #app{position:relative;width:100vw;height:100vh;overflow:hidden;}

  /* ---------- Ambient background ---------- */
  #ambient{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden;}
  .petal, .spark, .heart-p{position:absolute;will-change:transform,opacity;}
  .light-ray{
    position:absolute;top:-20%;width:40vw;height:140vh;
    background:linear-gradient(180deg, rgba(255,244,222,0.35), rgba(255,244,222,0) 70%);
    transform:rotate(12deg);filter:blur(6px);opacity:0.5;
  }

  /* ---------- Scenes ---------- */
  .scene{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    z-index:5;opacity:0;visibility:hidden;pointer-events:none;
    padding:6vh 5vw;
  }
  .scene.active{opacity:1;visibility:visible;pointer-events:auto;}

  /* ---------- Scene 1: Envelope ---------- */
  #scene-envelope{flex-direction:column;gap:28px;}
  .envelope-wrap{
    position:relative;width:min(360px,80vw);aspect-ratio:3/2;cursor:pointer;
    perspective:1400px;
  }
  .envelope-body{
    position:absolute;inset:0;
    background:linear-gradient(160deg,#fffaf1,var(--cream-deep));
    border-radius:6px;
    box-shadow:0 30px 60px -20px var(--shadow), 0 2px 0 rgba(255,255,255,0.6) inset;
    overflow:hidden;
  }
  .envelope-body::before{
    content:'';position:absolute;inset:0;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(217,164,160,0.08), transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(217,180,106,0.1), transparent 40%);
  }
  .flap{
    position:absolute;top:0;left:0;width:100%;height:56%;
    background:linear-gradient(160deg,#fff7ea,var(--rose-gold));
    clip-path:polygon(0 0,100% 0,50% 100%);
    transform-origin:top center;
    box-shadow:0 6px 18px -6px var(--shadow);
    transition:none;
    z-index:3;
  }
  .flap::after{
    content:'';position:absolute;left:50%;top:100%;transform:translate(-50%,-50%);
    width:56px;height:56px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #e6b9a6, var(--rose-gold-deep) 70%);
    box-shadow:0 4px 10px rgba(0,0,0,0.25) inset, 0 3px 8px rgba(0,0,0,0.2);
    display:flex;align-items:center;justify-content:center;
    z-index:4;
  }
  .flap::before{
    content:'♥';position:absolute;left:50%;top:100%;transform:translate(-50%,-50%);
    color:#fff2ea;font-size:20px;z-index:5;text-shadow:0 1px 1px rgba(0,0,0,0.25);
  }
  .letter-peek{
    position:absolute;left:8%;right:8%;bottom:-2%;height:70%;
    background:linear-gradient(180deg,#fffdf8,#fbf1e0);
    border-radius:4px 4px 0 0;
    box-shadow:0 -6px 20px -10px rgba(0,0,0,0.2);
    z-index:2;
    display:flex;align-items:flex-start;justify-content:center;padding-top:18px;
  }
  .letter-peek span{font-family:var(--font-display);color:var(--plum-soft);font-style:italic;font-size:0.85rem;}
  .to-label{
    position:absolute;left:0;right:0;bottom:22%;text-align:center;
    font-family:var(--font-display);font-style:italic;color:var(--plum-soft);
    font-size:clamp(1rem,3vw,1.3rem);z-index:1;letter-spacing:0.5px;
  }
  .tap-hint{
    font-family:var(--font-ui);font-weight:300;letter-spacing:3px;text-transform:uppercase;
    font-size:0.75rem;color:var(--plum-soft);opacity:0.75;
    animation:pulseHint 2.4s ease-in-out infinite;
  }
  @keyframes pulseHint{0%,100%{opacity:0.45;}50%{opacity:0.9;}}

  /* ---------- Scene 2: Intro letter ---------- */
  .paper-card{
    background:linear-gradient(180deg,#fffdf8,#fbf1de);
    border-radius:6px;
    box-shadow:0 40px 80px -30px var(--shadow), 0 0 0 1px rgba(217,164,160,0.15);
    padding:clamp(28px,6vw,60px);
    position:relative;
  }
  .paper-card::after{
    content:'';position:absolute;inset:10px;border:1px solid rgba(217,180,106,0.35);
    border-radius:3px;pointer-events:none;
  }
  #scene-intro .paper-card{width:min(560px,88vw);min-height:min(360px,50vh);
    display:flex;align-items:center;justify-content:center;}
  .hand-text{
    font-family:var(--font-hand);font-weight:500;color:var(--plum);
    font-size:clamp(1.5rem,4.2vw,2.3rem);line-height:1.5;text-align:center;
  }
  .type-cursor{display:inline-block;width:2px;background:var(--plum-soft);margin-left:2px;animation:blink 0.9s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}

  /* ---------- Scene 3: Question ---------- */
  #scene-question{flex-direction:column;gap:34px;}
  .beating-heart{
    width:110px;height:100px;position:relative;
    animation:beat 1.6s ease-in-out infinite;
  }
  .beating-heart svg{width:100%;height:100%;filter:drop-shadow(0 12px 24px var(--shadow));}
  @keyframes beat{0%,100%{transform:scale(1);}25%{transform:scale(1.08);}40%{transform:scale(0.97);}55%{transform:scale(1.05);}}
  .question-title{
    font-family:var(--font-display);font-style:italic;font-weight:600;
    font-size:clamp(1.4rem,4vw,2.1rem);text-align:center;color:var(--plum);
  }
  .ribbon-row{display:flex;flex-direction:column;gap:150px;margin-top:10px;position:relative;width:100%;align-items:center;justify-content:center;height:420px;}
  .ribbon{
    position:relative;padding:16px 42px;border-radius:40px;
    font-family:var(--font-display);font-style:italic;font-weight:600;font-size:1.15rem;
    color:#fff5ee;letter-spacing:0.5px;cursor:pointer;user-select:none;
    background:linear-gradient(135deg,#e8a9a8,#c9787c 55%,#e8b8ab);
    box-shadow:0 14px 30px -10px rgba(157,79,84,0.55), inset 0 1px 1px rgba(255,255,255,0.5), inset 0 -6px 10px rgba(120,50,55,0.25);
    text-align:center;
  }
  .ribbon::before{
    content:'';position:absolute;top:6px;left:10%;right:10%;height:30%;
    background:linear-gradient(180deg,rgba(255,255,255,0.55),transparent);
    border-radius:20px;pointer-events:none;
  }
  #ribbon-yes{position:relative;}
  #ribbon-no{position:relative;transition:transform 0.35s cubic-bezier(.2,1.4,.4,1);}

  /* ---------- Emoji burst ---------- */
  #emoji-layer{position:fixed;inset:0;z-index:50;pointer-events:none;overflow:hidden;}
  .emoji-particle{position:absolute;font-size:28px;will-change:transform,opacity;}

  /* ---------- Scene 4: Puzzle ---------- */
  #scene-puzzle{flex-direction:column;gap:22px;}
  .puzzle-title{font-family:var(--font-display);font-style:italic;color:var(--plum);font-size:clamp(1.1rem,3vw,1.5rem);text-align:center;}
  .puzzle-area{
    position:relative;width:min(560px,92vw);height:min(420px,54vh);
  }
  .heart-frame{
    position:absolute;left:50%;top:8%;transform:translateX(-50%);
    width:190px;height:170px;
  }
  .heart-frame svg{width:100%;height:100%;}
  .drop-zone{
    position:absolute;left:50%;top:8%;transform:translateX(-50%);
    width:190px;height:170px;pointer-events:none;
  }
  .piece-tray{
    position:absolute;bottom:0;left:0;right:0;height:44%;
  }
  .puzzle-piece{
    position:absolute;width:64px;height:64px;cursor:grab;
    filter:drop-shadow(0 8px 14px rgba(122,72,78,0.35));
    touch-action:none;
    z-index:10;
  }
  .puzzle-piece.placed{cursor:default;filter:drop-shadow(0 0 10px rgba(217,180,106,0.7));}
  .puzzle-piece svg{width:100%;height:100%;}
  .dialogue-card{
    width:min(500px,90vw);min-height:70px;
    background:linear-gradient(180deg,#fffdf8,#fbf1de);
    border-radius:10px;box-shadow:0 20px 40px -18px var(--shadow);
    padding:16px 22px;display:flex;align-items:center;justify-content:center;
    font-family:var(--font-hand);font-size:clamp(1.1rem,3vw,1.4rem);color:var(--plum);
    text-align:center;opacity:0;transform:translateY(10px);
    transition:opacity 0.5s ease, transform 0.5s ease;
  }
  .dialogue-card.show{opacity:1;transform:translateY(0);}

  .complete-btn-wrap{
    position:absolute;left:50%;top:8%;transform:translateX(-50%);
    width:190px;height:170px;
    display:flex;align-items:center;justify-content:center;
    z-index:20;pointer-events:none;
  }
  .complete-btn{
    padding:10px 16px;border-radius:50px;border:none;cursor:pointer;
    font-family:var(--font-display);font-style:italic;font-weight:600;font-size:0.72rem;
    color:#fff2f4;letter-spacing:0.2px;white-space:normal;line-height:1.3;
    max-width:150px;text-align:center;
    background:linear-gradient(135deg,#ff9fb0,#e8607d 60%,#ff8fae);
    box-shadow:0 0 24px 6px rgba(232,96,125,0.55), 0 14px 28px -10px rgba(196,60,90,0.6), inset 0 1px 1px rgba(255,255,255,0.55);
    opacity:0;transform:scale(0.7);pointer-events:none;
    animation:glowPulse 2.2s ease-in-out infinite;
  }
  .complete-btn.show{opacity:1;pointer-events:auto;}
  @keyframes glowPulse{
    0%,100%{box-shadow:0 0 24px 6px rgba(232,96,125,0.55), 0 14px 28px -10px rgba(196,60,90,0.6), inset 0 1px 1px rgba(255,255,255,0.55);}
    50%{box-shadow:0 0 38px 12px rgba(232,96,125,0.75), 0 14px 28px -10px rgba(196,60,90,0.6), inset 0 1px 1px rgba(255,255,255,0.55);}
  }

  /* ---------- Scene 5: Love letter ---------- */
  #scene-letter{overflow-y:auto;}
  #scene-letter .paper-card{
    width:min(600px,90vw);max-height:78vh;overflow-y:auto;
  }
  #letter-text{
    font-family:var(--font-hand);font-size:clamp(1.15rem,3vw,1.5rem);line-height:1.8;color:var(--plum);white-space:pre-wrap;
  }
  .continue-btn{
    margin-top:24px;display:inline-block;padding:10px 26px;border-radius:24px;
    font-family:var(--font-ui);font-size:0.85rem;letter-spacing:1px;text-transform:uppercase;
    background:linear-gradient(135deg,var(--gold-light),var(--gold));
    color:#4a3418;border:none;cursor:pointer;box-shadow:0 10px 20px -8px rgba(180,140,50,0.5);
    opacity:0;pointer-events:none;transition:opacity 0.6s ease;
  }
  .continue-btn.show{opacity:1;pointer-events:auto;}

  /* ---------- Gallery ---------- */
  #scene-gallery{flex-direction:column;gap:26px;overflow-y:auto;}
  .gallery-title{font-family:var(--font-display);font-style:italic;color:var(--plum);font-size:clamp(1.2rem,3.4vw,1.7rem);}
  .gallery-grid{
    display:flex;flex-wrap:wrap;gap:24px;justify-content:center;max-width:980px;padding-bottom:20px;
  }
  .polaroid{
    background:#fffdfa;padding:12px 12px 40px 12px;border-radius:3px;
    box-shadow:0 18px 34px -14px var(--shadow);
    width:180px;cursor:pointer;transition:transform 0.4s ease, box-shadow 0.4s ease;
    position:relative;
  }
  .polaroid:nth-child(1){transform:rotate(-4deg);}
  .polaroid:nth-child(2){transform:rotate(3deg);}
  .polaroid:nth-child(3){transform:rotate(-2deg);}
  .polaroid:nth-child(4){transform:rotate(5deg);}
  .polaroid:nth-child(5){transform:rotate(-3deg);}
  .polaroid:hover{transform:scale(1.06) rotate(0deg);box-shadow:0 26px 46px -14px var(--shadow);}
  .polaroid-img{
    width:100%;aspect-ratio:1/1;border-radius:2px;
    background:linear-gradient(135deg,var(--pink),var(--rose-gold));
    display:flex;align-items:center;justify-content:center;
    color:#fff5ef;font-family:var(--font-ui);font-size:0.7rem;letter-spacing:0.5px;text-align:center;padding:8px;
    position:relative;overflow:hidden;
  }
  .polaroid-img img{
    width:100%;height:100%;object-fit:cover;display:block;
  }
  .polaroid-img::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(115deg,rgba(255,255,255,0.35) 0%,rgba(255,255,255,0) 30%);
    pointer-events:none;
  }
  .polaroid-caption{
    position:absolute;bottom:10px;left:0;right:0;text-align:center;
    font-family:var(--font-hand);font-size:1.1rem;color:var(--plum-soft);
  }
  .next-btn{
    margin-top:6px;padding:10px 26px;border-radius:24px;
    font-family:var(--font-ui);font-size:0.8rem;letter-spacing:1px;text-transform:uppercase;
    background:linear-gradient(135deg,var(--gold-light),var(--gold));
    color:#4a3418;border:none;cursor:pointer;box-shadow:0 10px 20px -8px rgba(180,140,50,0.5);
  }

  /* ---------- Final scene ---------- */
  #scene-final{
    flex-direction:column;gap:26px;
    background:radial-gradient(ellipse at 50% 20%, #2c2140 0%, #17102a 55%, #0d0819 100%);
  }
  #scene-final.active{background:radial-gradient(ellipse at 50% 20%, #2c2140 0%, #17102a 55%, #0d0819 100%);}
  .star{position:absolute;background:#fff;border-radius:50%;opacity:0.8;}
  .lantern{
    position:absolute;width:26px;height:34px;
    background:linear-gradient(180deg,#ffd98c,#e8a45c);
    border-radius:6px 6px 10px 10px;
    box-shadow:0 0 18px 6px rgba(255,200,110,0.55);
    opacity:0.85;
  }
  .firefly{position:absolute;width:5px;height:5px;border-radius:50%;background:#eaffb0;box-shadow:0 0 8px 3px rgba(234,255,176,0.8);}
  .final-heart{width:120px;height:110px;position:relative;cursor:pointer;animation:beat 2.2s ease-in-out infinite;z-index:3;}
  .final-heart svg{width:100%;height:100%;filter:drop-shadow(0 0 26px rgba(255,180,190,0.55));}
  .final-msg{
    font-family:var(--font-display);font-style:italic;color:#fbeee0;
    font-size:clamp(1.2rem,3.6vw,1.8rem);text-align:center;z-index:3;opacity:0;
    transition:opacity 1.2s ease;
  }
  .final-msg.show{opacity:1;}
  #scene-final.fadeout{animation:fadeToBlack 2.5s ease forwards;}
  @keyframes fadeToBlack{to{background:#05030a;}}

  /* ---------- shared ---------- */
  .scene-content{display:flex;flex-direction:column;align-items:center;gap:20px;position:relative;z-index:2;}
  @media (max-width:520px){
    .ribbon-row{gap:40px;}
    .ribbon{padding:14px 30px;font-size:1rem;}
  }
</style>
</head>
<body>

<div id="app">
  <div id="ambient"></div>

  <!-- SCENE 1: ENVELOPE -->
  <section class="scene active" id="scene-envelope">
    <div class="envelope-wrap" id="envelope">
      <div class="envelope-body">
        <div class="to-label">To: My Queen ❤️</div>
        <div class="letter-peek"><span>...</span></div>
        <div class="flap" id="flap"></div>
      </div>
    </div>
    <div class="tap-hint">Tap to Open</div>
  </section>

  <!-- SCENE 2: INTRO LETTER -->
  <section class="scene" id="scene-intro">
    <div class="paper-card">
      <p class="hand-text" id="intro-text"></p>
    </div>
  </section>

  <!-- SCENE 3: QUESTION -->
  <section class="scene" id="scene-question">
    <div class="beating-heart">
      <svg viewBox="0 0 32 29"><path fill="#d9827f" d="M23.6 0c-3 0-5.9 1.6-7.6 4.2C14.3 1.6 11.4 0 8.4 0 3.8 0 0 3.8 0 8.6c0 8.6 10.2 14.6 16 20.4 5.8-5.8 16-11.8 16-20.4C32 3.8 28.2 0 23.6 0z"/></svg>
    </div>
    <div class="question-title">Wanna explore my heart?</div>
    <div class="ribbon-row">
      <div class="ribbon" id="ribbon-yes">YES</div>
      <div class="ribbon" id="ribbon-no">NO</div>
    </div>
  </section>

  <!-- SCENE 4: PUZZLE -->
  <section class="scene" id="scene-puzzle">
    <div class="puzzle-title">Piece my heart back together</div>
    <div class="puzzle-area" id="puzzle-area">
      <div class="heart-frame">
        <svg viewBox="0 0 100 90"><path fill="none" stroke="#d9b46a" stroke-width="2.5" stroke-dasharray="6 5" d="M50 88C20 65 2 45 2 24 2 10 13 0 26 0c9 0 17 5 24 14C57 5 65 0 74 0 87 0 98 10 98 24c0 21-18 41-48 64z"/></svg>
      </div>
      <div class="piece-tray" id="piece-tray"></div>
      <div class="complete-btn-wrap" id="complete-btn-wrap">
        <button class="complete-btn" id="complete-btn">Well done, now click me</button>
      </div>
    </div>
    <div class="dialogue-card" id="dialogue-card"></div>
  </section>

  <!-- SCENE 5: LOVE LETTER -->
  <section class="scene" id="scene-letter">
    <div class="paper-card">
      <p id="letter-text"></p>
      <button class="continue-btn" id="letter-continue">See the memories</button>
    </div>
  </section>

  <!-- GALLERY -->
  <section class="scene" id="scene-gallery">
    <div class="gallery-title">A few moments I keep close</div>
    <div class="gallery-grid" id="gallery-grid"></div>
    <button class="next-btn" id="gallery-next">Continue</button>
  </section>

  <!-- FINAL SCENE -->
  <section class="scene" id="scene-final">
    <div class="final-heart" id="final-heart">
      <svg viewBox="0 0 32 29"><path fill="#f2a6b0" d="M23.6 0c-3 0-5.9 1.6-7.6 4.2C14.3 1.6 11.4 0 8.4 0 3.8 0 0 3.8 0 8.6c0 8.6 10.2 14.6 16 20.4 5.8-5.8 16-11.8 16-20.4C32 3.8 28.2 0 23.6 0z"/></svg>
    </div>
    <div class="final-msg" id="final-msg">Thank you for exploring my heart.</div>
  </section>

</div>

<div id="emoji-layer"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(function(){
  "use strict";
  const $ = (s,root=document)=>root.querySelector(s);
  const $$ = (s,root=document)=>Array.from(root.querySelectorAll(s));

  /* ============ AMBIENT BACKGROUND ============ */
  const ambient = $('#ambient');
  function rand(min,max){return Math.random()*(max-min)+min;}

  function spawnPetal(){
    const p = document.createElement('div');
    p.className='petal';
    p.style.left = rand(0,100)+'vw';
    p.style.top = '-5vh';
    p.style.fontSize = rand(14,24)+'px';
    p.style.opacity = rand(0.4,0.8);
    p.textContent = '❀';
    p.style.color = 'rgba(217,164,160,0.7)';
    ambient.appendChild(p);
    gsap.to(p,{
      y: '110vh',
      x: '+='+rand(-80,80),
      rotation: rand(180,540),
      duration: rand(14,22),
      ease:'none',
      onComplete:()=>p.remove()
    });
    gsap.to(p,{opacity:0,duration:3,delay:rand(9,16),ease:'power1.in'});
  }
  function spawnSpark(){
    const s = document.createElement('div');
    s.className='spark';
    s.style.left = rand(0,100)+'vw';
    s.style.top = rand(0,100)+'vh';
    s.style.width = s.style.height = rand(2,4)+'px';
    s.style.background = '#f3dca0';
    s.style.borderRadius='50%';
    s.style.boxShadow = '0 0 6px 2px rgba(243,220,160,0.8)';
    ambient.appendChild(s);
    gsap.fromTo(s,{opacity:0,scale:0.4},{opacity:1,scale:1.1,duration:1.4,yoyo:true,repeat:1,ease:'sine.inOut',onComplete:()=>s.remove()});
  }
  function spawnHeartFloat(){
    const h = document.createElement('div');
    h.className='heart-p';
    h.textContent='♥';
    h.style.left = rand(0,100)+'vw';
    h.style.bottom='-5vh';
    h.style.fontSize = rand(10,18)+'px';
    h.style.color = 'rgba(232,169,168,0.55)';
    ambient.appendChild(h);
    gsap.to(h,{y:'-70vh',x:'+='+rand(-40,40),opacity:0,duration:rand(10,16),ease:'sine.out',onComplete:()=>h.remove()});
  }
  ['A','B'].forEach((_,i)=>{
    const ray=document.createElement('div');
    ray.className='light-ray';
    ray.style.left = (20+i*45)+'vw';
    ambient.appendChild(ray);
  });
  setInterval(spawnPetal, 1400);
  setInterval(spawnSpark, 900);
  setInterval(spawnHeartFloat, 2200);

  /* ============ SCENE MANAGEMENT ============ */
  const scenes = ['scene-envelope','scene-intro','scene-question','scene-puzzle','scene-letter','scene-gallery','scene-final'];
  function goTo(id){
    scenes.forEach(s=>{
      const el = document.getElementById(s);
      if(!el) return;
      if(s===id){
        el.classList.add('active');
        gsap.fromTo(el,{opacity:0},{opacity:1,duration:1.1,ease:'power2.out'});
      } else {
        if(el.classList.contains('active')){
          gsap.to(el,{opacity:0,duration:0.8,ease:'power2.in',onComplete:()=>el.classList.remove('active')});
        }
      }
    });
  }

  /* ============ SCENE 1: ENVELOPE ============ */
  const envelope = $('#envelope');
  const flap = $('#flap');
  let opened = false;
  envelope.addEventListener('click', ()=>{
    if(opened) return;
    opened = true;
    const tl = gsap.timeline();
    tl.to(flap,{rotationX:180,duration:1.1,ease:'power2.inOut',transformOrigin:'top center'})
      .to('.envelope-wrap',{y:-20,scale:1.06,duration:0.6,ease:'power2.out'},'-=0.4')
      .to('.envelope-wrap',{scale:1.5,opacity:0,duration:0.9,ease:'power2.in',delay:0.3})
      .to('.tap-hint',{opacity:0,duration:0.4},'<')
      .call(()=>{ goTo('scene-intro'); startIntroLetter(); });
  });

  /* ============ SCENE 2: INTRO LETTER (typewriter) ============ */
  const introFull = "I've been keeping something inside my heart...\nSomething I've wanted to show only you.\n\nWill you come a little closer?";
  function typeText(el, text, speed, done){
    el.innerHTML = '';
    const cursor = document.createElement('span');
    cursor.className='type-cursor';
    cursor.innerHTML = '&nbsp;';
    let i=0;
    function step(){
      if(i<text.length){
        el.innerHTML = text.slice(0,i+1).replace(/\n/g,'<br>');
        el.appendChild(cursor);
        i++;
        setTimeout(step, speed + (text[i-1]==='.'?200:0));
      } else {
        cursor.remove();
        if(done) setTimeout(done, 1200);
      }
    }
    step();
  }
  function startIntroLetter(){
    typeText($('#intro-text'), introFull, 42, ()=>{
      gsap.to('#scene-intro .paper-card',{
        rotationX:70, y:-40, opacity:0, duration:1,ease:'power2.in',
        transformOrigin:'top center',
        onComplete:()=>goTo('scene-question')
      });
    });
  }

  /* ============ SCENE 3: QUESTION / RIBBONS ============ */
  const ribbonNo = $('#ribbon-no');
  const ribbonRow = $('.ribbon-row');
  function placeNoInitial(){
    ribbonNo.style.transform = 'translate(0,0)';
  }
  placeNoInitial();

  let noBaseRect = null, yesRect = null;
  function captureRects(){
    // capture untransformed base rect of NO and the static rect of YES once,
    // so we can predict overlap before committing to a dodge position
    gsap.set(ribbonNo,{x:0,y:0,rotation:0,scale:1});
    noBaseRect = ribbonNo.getBoundingClientRect();
    yesRect = $('#ribbon-yes').getBoundingClientRect();
  }
  function rectsOverlap(a,b,pad){
    return !(a.right+pad < b.left || a.left-pad > b.right || a.bottom+pad < b.top || a.top-pad > b.bottom);
  }
  function dodgeNo(clientX, clientY){
    if(!noBaseRect || !yesRect) captureRects();
    const vw = window.innerWidth, vh = window.innerHeight;
    let attempt, tries = 0, chosen = null;
    while(tries < 12 && !chosen){
      tries++;
      const dx = rand(-vw*0.32, vw*0.32);
      const dy = rand(-vh*0.22, vh*0.22);
      const predicted = {
        left: noBaseRect.left+dx, right: noBaseRect.right+dx,
        top: noBaseRect.top+dy, bottom: noBaseRect.bottom+dy
      };
      const withinViewport = predicted.left>10 && predicted.right<vw-10 && predicted.top>10 && predicted.bottom<vh-10;
      const clearOfYes = !rectsOverlap(predicted, yesRect, 40);
      if(withinViewport && clearOfYes){
        chosen = {x:dx,y:dy};
      }
    }
    if(!chosen) chosen = {x: (yesRect.left < vw/2 ? vw*0.3 : -vw*0.3), y: -vh*0.15};
    gsap.killTweensOf(ribbonNo);
    gsap.to(ribbonNo,{
      x: chosen.x, y: chosen.y, rotation: rand(-15,15), scale: 1,
      duration: rand(0.28,0.4), ease:'back.out(2.2)'
    });
  }
  function nearNo(x,y){
    const r = ribbonNo.getBoundingClientRect();
    const cx = r.left+r.width/2, cy = r.top+r.height/2;
    const dist = Math.hypot(x-cx,y-cy);
    return dist < 110;
  }
  document.addEventListener('mousemove', e=>{
    if(!$('#scene-question').classList.contains('active')) return;
    if(nearNo(e.clientX,e.clientY)) dodgeNo(e.clientX,e.clientY);
  });
  document.addEventListener('touchmove', e=>{
    if(!$('#scene-question').classList.contains('active')) return;
    const t = e.touches[0]; if(!t) return;
    if(nearNo(t.clientX,t.clientY)) dodgeNo(t.clientX,t.clientY);
  },{passive:true});
  ribbonNo.addEventListener('click', (e)=>{ dodgeNo(e.clientX,e.clientY); });
  ribbonNo.addEventListener('touchstart', (e)=>{ const t=e.touches[0]; dodgeNo(t.clientX,t.clientY); });

  $('#ribbon-yes').addEventListener('click', onYes);
  let yesClicked=false;
  function onYes(){
    if(yesClicked) return; yesClicked=true;
    const tl = gsap.timeline();
    tl.to('#ribbon-yes',{scaleX:1.3,scaleY:0.7,duration:0.25,ease:'power1.out'})
      .to('#ribbon-yes',{scaleX:0.2,opacity:0,rotation:20,duration:0.5,ease:'power2.in'})
      .to('#ribbon-no',{opacity:0,duration:0.3},'<')
      .to('.beating-heart, .question-title',{opacity:0,duration:0.4},'<')
      .call(burstEmojis)
      .call(()=>{
        setTimeout(()=>{ goTo('scene-puzzle'); initPuzzle(); }, 1600);
      });
  }
  function burstEmojis(){
    const layer = $('#emoji-layer');
    const emojis = ['💝','💖','💘','💞','💕','🫂','🌸','🎀','✨','🌟','💫'];
    const cx = window.innerWidth/2, cy = window.innerHeight/2;
    for(let i=0;i<46;i++){
      const el = document.createElement('div');
      el.className='emoji-particle';
      el.textContent = emojis[Math.floor(rand(0,emojis.length))];
      el.style.left = cx+'px'; el.style.top = cy+'px';
      layer.appendChild(el);
      const ang = rand(0,Math.PI*2);
      const dist = rand(120,340);
      const tx = Math.cos(ang)*dist, ty = Math.sin(ang)*dist - 60;
      gsap.timeline()
        .to(el,{x:tx,y:ty,rotation:rand(-90,90),scale:rand(0.8,1.4),opacity:1,duration:rand(0.7,1.1),ease:'power2.out'})
        .to(el,{y:ty+rand(260,380),opacity:0,rotation:'+=60',duration:rand(1.6,2.2),ease:'power1.in',onComplete:()=>el.remove()});
    }
  }

  /* ============ SCENE 4: PUZZLE ============ */
  const puzzleLines = [
    "Out of billions of people in this world, I still don't know how I got lucky enough to choose you.",
    "Every place feels like home the moment you're standing in it with me.",
    "It's strange how the smallest, most ordinary moments with you become the ones I remember most.",
    "I didn't know my heart had a missing piece until it started beating in rhythm with yours.",
    "With every piece back in place, I think... my heart finally feels complete."
  ];
  let placedCount = 0;
  const totalPieces = 5;

  function initPuzzle(){
    placedCount = 0;
    const tray = $('#piece-tray');
    tray.innerHTML='';
    $('#dialogue-card').classList.remove('show');
    $('#complete-btn').classList.remove('show');
    $('#complete-btn-wrap').style.pointerEvents = 'none';
    const positions = [
      {left:'6%',top:'6%'},{left:'62%',top:'2%'},{left:'2%',top:'50%'},
      {left:'70%',top:'46%'},{left:'36%',top:'20%'}
    ];
    for(let i=0;i<totalPieces;i++){
      const piece = document.createElement('div');
      piece.className='puzzle-piece';
      piece.dataset.index = i;
      piece.style.left = positions[i].left;
      piece.style.top = positions[i].top;
      piece.innerHTML = `<svg viewBox="0 0 64 58"><path fill="#e29a9c" stroke="#c9787c" stroke-width="1.5" d="M47 0c-6 0-11 3.2-15 8.4C28 3.2 23 0 17 0 7.6 0 0 7.6 0 17c0 17.2 20.4 29.2 32 40.8C43.6 46.2 64 34.2 64 17 64 7.6 56.4 0 47 0z"/></svg>`;
      tray.appendChild(piece);
      makeTappable(piece);
    }
  }

  function makeTappable(piece){
    let locked = false;
    function onTap(e){
      if(piece.classList.contains('placed') || locked) return;
      locked = true;
      // little "lift" pulse before flying to the frame, for tactile feedback
      gsap.to(piece,{scale:1.15,duration:0.12,ease:'power1.out',onComplete:()=>{
        snapPiece(piece);
      }});
    }
    piece.addEventListener('click', onTap);
    piece.addEventListener('touchstart', (e)=>{ e.preventDefault(); onTap(e); },{passive:false});
  }

  function snapPiece(piece){
    piece.classList.add('placed');
    const area = $('#puzzle-area');
    const areaRect = area.getBoundingClientRect();
    const frame = $('.heart-frame');
    const fr = frame.getBoundingClientRect();
    const idx = parseInt(piece.dataset.index);
    const targetOffsets = [
      {x:-30,y:-14},{x:22,y:-18},{x:-34,y:22},{x:26,y:24},{x:-4,y:0}
    ];
    const off = targetOffsets[idx % targetOffsets.length];
    const targetLeft = (fr.left - areaRect.left) + fr.width/2 - 32 + off.x;
    const targetTop = (fr.top - areaRect.top) + fr.height/2 - 29 + off.y;

    gsap.to(piece,{
      left: targetLeft, top: targetTop, duration:0.5, ease:'back.out(1.8)',
      onComplete:()=>{
        pulseGlow(piece);
        placedCount++;
        showDialogue(puzzleLines[placedCount-1]);
        if(placedCount>=totalPieces){
          setTimeout(completeHeart, 1600);
        }
      }
    });
  }
  function pulseGlow(piece){
    piece.style.filter='drop-shadow(0 0 14px rgba(217,180,106,0.9))';
    gsap.fromTo(piece,{scale:1.25},{scale:1,duration:0.5,ease:'elastic.out(1,0.5)'});
    for(let i=0;i<8;i++){
      const s=document.createElement('div');
      s.style.position='absolute';
      s.style.left=piece.style.left; s.style.top=piece.style.top;
      s.style.width=s.style.height='4px';
      s.style.borderRadius='50%';
      s.style.background='#f3dca0';
      s.style.pointerEvents='none';
      $('#puzzle-area').appendChild(s);
      const ang = rand(0,Math.PI*2), dist=rand(20,50);
      gsap.to(s,{left:'+='+Math.cos(ang)*dist,top:'+='+Math.sin(ang)*dist,opacity:0,duration:0.7,onComplete:()=>s.remove()});
    }
  }
  function showDialogue(text){
    const card = $('#dialogue-card');
    card.classList.remove('show');
    setTimeout(()=>{
      card.innerHTML='';
      card.classList.add('show');
      let i=0;
      function step(){
        if(i<text.length){
          card.textContent = text.slice(0,i+1);
          i++;
          setTimeout(step,26);
        }
      }
      step();
    },200);
  }
  function completeHeart(){
    $('#dialogue-card').classList.remove('show');
    const frame = $('.heart-frame svg path');
    gsap.to(frame,{attr:{stroke:'#f0cf7a'},duration:0.6});
    const btn = $('#complete-btn');
    $('#complete-btn-wrap').style.pointerEvents = 'auto';
    btn.classList.add('show');
    gsap.fromTo(btn,{scale:0.5,opacity:0},{scale:1,opacity:1,duration:0.7,ease:'back.out(1.8)'});
    btn.addEventListener('click', onCompleteClick, {once:true});
  }

  function onCompleteClick(){
    const btn = $('#complete-btn');
    const tl = gsap.timeline();
    tl.to(btn,{scale:1.15,duration:0.15,ease:'power1.out'})
      .to(btn,{scale:0.4,opacity:0,duration:0.45,ease:'power2.in'})
      .call(()=>{
        for(let i=0;i<20;i++){
          const s=document.createElement('div');
          s.style.position='fixed';
          const r = $('.heart-frame').getBoundingClientRect();
          s.style.left=(r.left+r.width/2)+'px'; s.style.top=(r.top+r.height/2)+'px';
          s.style.width=s.style.height='5px'; s.style.borderRadius='50%';
          s.style.background='#f3dca0'; s.style.zIndex=60;
          document.body.appendChild(s);
          const ang=rand(0,Math.PI*2), dist=rand(40,120);
          gsap.to(s,{left:'+='+Math.cos(ang)*dist, top:'+='+Math.sin(ang)*dist, opacity:0, duration:1,onComplete:()=>s.remove()});
        }
      })
      .to('#scene-puzzle',{opacity:0,duration:1,delay:0.6,ease:'power2.in',onComplete:()=>{
        goTo('scene-letter'); startLoveLetter();
      }});
  }

  /* ============ SCENE 5: LOVE LETTER ============ */
  const loveLetterText = `My love,

If you're reading this, it means you made it all the way through the pieces of my heart — and somehow, that feels like the most fitting thing in the world, because you've always been the one who puts everything back together.

I don't have a grand way of saying this, so I'll just say it plainly: being with you has made ordinary days feel like something worth remembering. I like who I am when I'm around you.

Thank you for staying, for choosing me on the easy days and the hard ones, and for letting me love you the way I do.

Forever yours.`;

  let letterTyped=false;
  function startLoveLetter(){
    if(letterTyped) return;
    letterTyped=true;
    typeText($('#letter-text'), loveLetterText, 22, ()=>{
      $('#letter-continue').classList.add('show');
    });
  }
  $('#letter-continue').addEventListener('click', ()=>{
    goTo('scene-gallery');
    buildGallery();
  });

  /* ============ GALLERY ============ */
  function buildGallery(){
    const grid = $('#gallery-grid');
    if(grid.dataset.built) return;
    grid.dataset.built='1';
    const photos = [
      {file:'PLACEHOLDER PHOTO 1.jpg', caption:'Oh'},
      {file:'PLACEHOLDER PHOTO 2.jpg', caption:'You'},
      {file:'PLACEHOLDER PHOTO 3.jpg', caption:'Are'},
      {file:'PLACEHOLDER PHOTO 4.jpg', caption:'F#cking'},
      {file:'PLACEHOLDER PHOTO 5.jpg', caption:'Lovely'}
    ];
    photos.forEach(p=>{
      const card = document.createElement('div');
      card.className='polaroid';
      card.innerHTML = `<div class="polaroid-img"><img src="${encodeURI(p.file)}" alt="${p.caption}" onerror="this.remove(); this.parentElement.textContent='Missing: ${p.file}';"></div><div class="polaroid-caption">${p.caption}</div>`;
      card.addEventListener('click', ()=> openLightbox(p));
      grid.appendChild(card);
    });
  }

  function openLightbox(p){
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;z-index:80;background:rgba(20,10,16,0.72);display:flex;align-items:center;justify-content:center;opacity:0;';
    overlay.innerHTML = `
      <div style="background:#fffdfa;padding:16px 16px 46px 16px;border-radius:4px;max-width:min(420px,86vw);box-shadow:0 40px 80px -20px rgba(0,0,0,0.5);position:relative;">
        <div style="width:100%;aspect-ratio:1/1;border-radius:2px;overflow:hidden;background:linear-gradient(135deg,var(--pink),var(--rose-gold));display:flex;align-items:center;justify-content:center;color:#fff5ef;font-family:var(--font-ui);font-size:0.8rem;">
          <img src="${encodeURI(p.file)}" alt="${p.caption}" style="width:100%;height:100%;object-fit:cover;" onerror="this.remove();">
        </div>
        <div style="position:absolute;bottom:12px;left:0;right:0;text-align:center;font-family:var(--font-hand);font-size:1.3rem;color:var(--plum-soft);">${p.caption}</div>
      </div>`;
    overlay.addEventListener('click', ()=>{
      gsap.to(overlay,{opacity:0,duration:0.3,onComplete:()=>overlay.remove()});
    });
    document.body.appendChild(overlay);
    gsap.to(overlay,{opacity:1,duration:0.35});
    gsap.fromTo(overlay.firstElementChild,{scale:0.85,y:20},{scale:1,y:0,duration:0.45,ease:'back.out(1.6)'});
  }
  $('#gallery-next').addEventListener('click', ()=>{
    goTo('scene-final');
    initFinalScene();
  });

  /* ============ FINAL SCENE ============ */
  let finalBuilt=false;
  function initFinalScene(){
    if(finalBuilt) return;
    finalBuilt=true;
    const scene = $('#scene-final');
    for(let i=0;i<60;i++){
      const star=document.createElement('div');
      star.className='star';
      star.style.left=rand(0,100)+'%';
      star.style.top=rand(0,60)+'%';
      star.style.width=star.style.height=rand(1,2.5)+'px';
      scene.appendChild(star);
      gsap.to(star,{opacity:rand(0.2,0.9),duration:rand(1.5,3),yoyo:true,repeat:-1,ease:'sine.inOut'});
    }
    for(let i=0;i<8;i++){
      const l=document.createElement('div');
      l.className='lantern';
      l.style.left=rand(5,95)+'%';
      l.style.top=rand(20,80)+'%';
      scene.appendChild(l);
      gsap.to(l,{y:'-=30',x:'+='+rand(-15,15),duration:rand(6,10),yoyo:true,repeat:-1,ease:'sine.inOut'});
    }
    for(let i=0;i<24;i++){
      const f=document.createElement('div');
      f.className='firefly';
      f.style.left=rand(0,100)+'%';
      f.style.top=rand(30,90)+'%';
      scene.appendChild(f);
      gsap.to(f,{x:'+='+rand(-40,40),y:'+='+rand(-40,40),opacity:rand(0.2,1),duration:rand(3,6),yoyo:true,repeat:-1,ease:'sine.inOut'});
    }
    setTimeout(()=>{ $('#final-msg').classList.add('show'); },1000);

    let touched=false;
    $('#final-heart').addEventListener('click', ()=>{
      if(touched) return; touched=true;
      gsap.to('#final-heart',{scale:1.4,duration:0.5,ease:'power2.out',yoyo:true,repeat:1});
      setTimeout(()=>{
        scene.classList.add('fadeout');
      },900);
    });
  }

})();
</script>
</body>
</html>
